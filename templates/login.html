<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In - PocketSmart AI</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <nav class="navbar"><a href="/" class="logo">PocketSmart AI</a></nav>
    <div class="container" style="max-width: 450px;">
        <div class="card">
            <h2>Welcome Back</h2>
            <form id="loginForm">
                <label>Username</label>
                <input type="text" name="username" required>
                <label>Password</label>
                <input type="password" name="password" required>
                <button type="submit" class="btn" style="width: 100%;">Sign In</button>
            </form>
            <p style="margin-top: 1rem; text-align: center; font-size: 0.9rem;">
                Don't have an account? <a href="/register">Create Account</a>
            </p>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const res = await fetch('/token', { method: 'POST', body: formData });
            if (res.ok) {
                window.location.href = '/dashboard';
            } else {
                alert('Invalid credentials. Please try again.');
            }
        });
    </script>
</body>
</html>
